version: "3.9"

services:

  # ─────────────────────────────────────────────
  # Microsoft SQL Server
  # ─────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jewelry_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Express"          # Use 'Developer' or 'Standard' if needed
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./create-jewelry-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P '${DB_PASSWORD}' -Q 'SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - jewelry_net

  # ─────────────────────────────────────────────
  # Spring Boot Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./Jewelry-Store
      dockerfile: Dockerfile
    container_name: jewelry_backend
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=${DB_NAME};encrypt=false;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "SA"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      SPRING_PROFILES_ACTIVE: "docker"
      VNPAY_TMN_CODE: "${VNPAY_TMN_CODE}"
      VNPAY_HASH_SECRET: "${VNPAY_HASH_SECRET}"
    ports:
      - "8080:8080"
    networks:
      - jewelry_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────
  # JavaScript Frontend (served via Nginx)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: "./Front end offical file"
      dockerfile: Dockerfile
    container_name: jewelry_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - jewelry_net

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  sqlserver_data:
    name: jewelry_sqlserver_data

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  jewelry_net:
    name: jewelry_network
    driver: bridge
